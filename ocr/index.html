<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OCR Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<header>
  <button onclick="location.href='../index.html'">⬅ Back</button>
  <h2>OCR Scanner</h2>
</header>

<main>

  <div id="dropZone">
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <p>📷 Tap to Camera / Upload Image<br>or Drag & Drop</p>
  </div>

  <img id="preview" hidden>

  <button id="extractBtn" hidden>Extract Text</button>

  <textarea id="output" placeholder="Extracted text appears here..."></textarea>

</main>

<script src="js/app.js"></script>
</body>
</html>
