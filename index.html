<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#ffffff;
  color:#111827;
}

header{
  text-align:center;
  padding:30px 15px;
  font-size:28px;
  font-weight:600;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap:20px;
}

.tile{
  background:#f3f4f6;
  border-radius:12px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  text-decoration:none;
  color:#111827;
  box-shadow:0 4px 8px rgba(0,0,0,0.08);
  transition:0.2s ease;
}

.tile:hover{
  background:#e5e7eb;
  transform:translateY(-4px);
}
</style>
</head>

<body>

<header>Work Tools</header>

<div class="container">
  <a class="tile" href="tool1.html">1</a>
  <a class="tile" href="tool2.html">2</a>
  <a class="tile" href="tool3.html">3</a>
  <a class="tile" href="tool4.html">4</a>
  <a class="tile" href="tool5.html">5</a>
  <a class="tile" href="tool6.html">6</a>
  <a class="tile" href="tool7.html">7</a>
  <a class="tile" href="tool8.html">8</a>
  <a class="tile" href="tool9.html">9</a>
  <a class="tile" href="tool10.html">10</a>
</div>

</body>
</html>
